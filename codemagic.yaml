workflows:
  flutter-ios:
    name: Stock Spheres iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: stocksphere

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.stocksphere.app

      vars:
        BUNDLE_ID: "com.stocksphere.app"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"

    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter packages pub get

      - name: Install CocoaPods dependencies
        script: |
          if [ -f ios/Podfile ]; then
            cd ios && pod install
          fi

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          EXPORT_PLIST_FLAG=""
          if [ -f /Users/builder/export_options.plist ]; then
            EXPORT_PLIST_FLAG="--export-options-plist=/Users/builder/export_options.plist"
          fi
          # Read version name from pubspec.yaml (e.g. 1.0.1)
          BUILD_NAME=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          BUILD_NAME=${BUILD_NAME:-1.0.1}
          # App Store Connect requires bundle version higher than previous version (previously uploaded was 2).
          BUILD_NUM=$((${BUILD_NUMBER:-1} + 10))
          flutter build ipa --release \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUM \
            $EXPORT_PLIST_FLAG

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
